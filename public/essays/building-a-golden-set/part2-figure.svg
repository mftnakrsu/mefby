<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 720" width="100%" style="height:auto" role="img" aria-labelledby="p2-title p2-desc">
<title id="p2-title">Simple random vs stratified sampling, drawing 10 tickets from a population of 40 with a rare urgent class</title>
<desc id="p2-desc">A population of 40 support tickets, 8 truly urgent (the rare class, marked with a dot) and 32 not, true urgent rate 0.20. The left grid shows one simple-random draw of 10 tickets (emerald rings): it happens to pick 4 urgent tickets, a measured rate of 0.40, twice the true rate, and it clumps in the top rows while missing the bottom rows entirely. The right grid shows one stratified draw of 10 tickets: it pulls 2 from the 8 urgent tickets and 8 from the 32 non-urgent tickets, a measured rate of exactly 0.20, matching the population, and it spreads across every row. A stats strip below, from 10,000 resamples with a fixed seed, shows simple-random has mean urgent count 1.997 with std 1.105, and 743 of 10,000 draws, 0.074, contain zero urgent tickets; stratified has mean 2.000 with std 0.000, always exactly 2. An exact hypergeometric cross-check gives P(zero urgent) = 0.076 and std of urgent count = 1.109, confirming the simulation. The takeaway: stratifying pins the rare class's share and drives its variance to zero, while simple random sampling has real spread and can miss the rare class entirely.</desc>
